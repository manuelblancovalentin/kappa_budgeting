name: Experiment Log
description: Record an experiment, failed attempt, result, or observation.
title: "[Experiment]: "
labels: ["experiment", "log"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What were you trying to test?
      placeholder: "Example: Test whether fixed-point retraining recovers AUC after sensor-column corruption."
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Setup
      description: Branch, commit, dataset, parameters, hardware, software versions.
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: Result
      description: What happened? Include numbers, plots, logs, failures, or links.
    validations:
      required: true

  - type: textarea
    id: interpretation
    attributes:
      label: Interpretation
      description: What do you think this means?
    validations:
      required: false

  - type: textarea
    id: next_steps
    attributes:
      label: Next steps
      description: What should someone do next?
    validations:
      required: false